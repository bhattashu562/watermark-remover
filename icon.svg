<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#wandGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(168,85,247,0.15)" stroke-width="1.5" stroke-dasharray="8 8"/>
  
  <!-- Magic Star Sparkle (Gemini-style 4-point star) -->
  <g filter="url(#glow)">
    <path d="M 256 100 Q 256 220 136 220 Q 256 220 256 340 Q 256 220 376 220 Q 256 220 256 100 Z" fill="url(#starGrad)" />
  </g>
  
  <!-- Magic Wand Diagonal -->
  <g transform="rotate(-45 256 256)">
    <rect x="246" y="270" width="20" height="180" rx="10" fill="url(#wandGrad)" filter="url(#glow)"/>
    <rect x="250" y="250" width="12" height="25" rx="6" fill="#ffffff"/>
  </g>
  
  <!-- Accent Sparkles -->
  <circle cx="160" cy="140" r="8" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="360" cy="150" r="12" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="390" cy="330" r="7" fill="#e879f9" filter="url(#glow)"/>
  <circle cx="130" cy="350" r="9" fill="#818cf8" filter="url(#glow)"/>
</svg>